[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "decision-intelligence-interview"
version = "0.1.0"
description = "Synthetic-data statistical research and interview preparation lab"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "scikit-learn>=1.3", "duckdb>=0.10", "plotly>=5.18", "streamlit>=1.30"]
[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
